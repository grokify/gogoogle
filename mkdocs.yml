site_name: GoGoogle
site_url: https://grokify.github.io/gogoogle/
site_description: Go libraries for Google APIs
site_author: Grokify

repo_name: grokify/gogoogle
repo_url: https://github.com/grokify/gogoogle

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Guides:
      - Getting Started: guides/getting-started.md
      - Docs:
          - Overview: guides/docs/index.md
      - Drive:
          - Overview: guides/drive/index.md
      - Gmail:
          - Overview: guides/gmail/index.md
          - Sending Emails: guides/gmail/sending.md
          - Reading Messages: guides/gmail/messages.md
          - Mail Merge: guides/gmail/mail-merge.md
      - Sheets:
          - Overview: guides/sheets/index.md
      - Search Console:
          - Overview: guides/searchconsole/index.md
      - Slides:
          - Overview: guides/slides/index.md
      - Maps:
          - Static Maps: guides/maps/index.md
      - Speech:
          - Speech-to-Text: guides/speech/stt.md
          - Text-to-Speech: guides/speech/tts.md
      - CLI:
          - Overview: guides/cli/index.md
  - Design:
      - Overview: design/index.md
      - Architecture: design/architecture/index.md
      - Architecture Decisions: design/adrs/index.md
  - Specs:
      - Overview: specs/index.md
      - INIT-GOGOOGLE-001:
          - PRD: specs/initiatives/INIT-GOGOOGLE-001/PRD.md
          - TRD: specs/initiatives/INIT-GOGOOGLE-001/TRD.md
          - Plan: specs/initiatives/INIT-GOGOOGLE-001/PLAN.md
          - Roadmap: specs/initiatives/INIT-GOGOOGLE-001/ROADMAP.md
  - Releases:
      - Overview: releases/index.md
      - v0.14.0: releases/v0.14.0.md
      - v0.13.0: releases/v0.13.0.md
      - v0.12.0: releases/v0.12.0.md
      - v0.11.0: releases/v0.11.0.md
      - v0.10.0: releases/v0.10.0.md
      - Changelog: releases/changelog.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
